version: '3.8'

services:
  temperature-1:
    build: .
    container_name: temperature-sensor-1
    environment:
      - MQTT_HOST=192.168.${BIRTH_DAY}.1
      - MQTT_PORT=1883
      - SENSOR_TYPE=temperature
      - SENSOR_NAME=temperature_sensor_1
      - PUBLISH_INTERVAL=3
      - TOPIC_FORMAT=json
      - BIRTH_DATE=${BIRTH_DATE}
    restart: unless-stopped

  temperature-2:
    build: .
    container_name: temperature-sensor-2
    environment:
      - MQTT_HOST=192.168.${BIRTH_DAY}.1
      - MQTT_PORT=1883
      - SENSOR_TYPE=temperature
      - SENSOR_NAME=temperature_sensor_2
      - PUBLISH_INTERVAL=5
      - TOPIC_FORMAT=raw
      - BIRTH_DATE=${BIRTH_DATE}
    restart: unless-stopped

  pressure-1:
    build: .
    container_name: pressure-sensor-1
    environment:
      - MQTT_HOST=192.168.${BIRTH_DAY}.1
      - MQTT_PORT=1883
      - SENSOR_TYPE=pressure
      - SENSOR_NAME=pressure_sensor_1
      - PUBLISH_INTERVAL=4
      - TOPIC_FORMAT=json
      - BIRTH_DATE=${BIRTH_DATE}
    restart: unless-stopped

  pressure-2:
    build: .
    container_name: pressure-sensor-2
    environment:
      - MQTT_HOST=192.168.${BIRTH_DAY}.1
      - MQTT_PORT=1883
      - SENSOR_TYPE=pressure
      - SENSOR_NAME=pressure_sensor_2
      - PUBLISH_INTERVAL=6
      - TOPIC_FORMAT=raw
      - BIRTH_DATE=${BIRTH_DATE}
    restart: unless-stopped

  current-1:
    build: .
    container_name: current-sensor-1
    environment:
      - MQTT_HOST=192.168.${BIRTH_DAY}.1
      - MQTT_PORT=1883
      - SENSOR_TYPE=current
      - SENSOR_NAME=current_sensor_1
      - PUBLISH_INTERVAL=2
      - TOPIC_FORMAT=json
      - BIRTH_DATE=${BIRTH_DATE}
    restart: unless-stopped

  humidity-1:
    build: .
    container_name: humidity-sensor-1
    environment:
      - MQTT_HOST=192.168.${BIRTH_DAY}.1
      - MQTT_PORT=1883
      - SENSOR_TYPE=humidity
      - SENSOR_NAME=humidity_sensor_1
      - PUBLISH_INTERVAL=7
      - TOPIC_FORMAT=json
      - BIRTH_DATE=${BIRTH_DATE}
    restart: unless-stopped
